name: fmsg triage agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: fmsg-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (triage model)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run one agent pass
        env:
          FMSG_API_KEY: ${{ secrets.FMSG_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node agent_ci.js
